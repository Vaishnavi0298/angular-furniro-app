<div class="card border-none product-card position-relative">
  <div class="position-relative">
    <img src="{{image}}" class="card-img-top img-fluid" alt="{{name}}">
    <span *ngIf="discount" class="badge bg-danger position-absolute top-0 start-0 m-2 rounded-pill">{{discount}}</span>
    <span *ngIf="isNew" class="badge bg-success position-absolute top-0 end-0 m-2 rounded-pill">New</span>
  </div>
  <div class="card-body">
    <h5 class="card-title">{{name}}</h5>
    <p class="card-text">{{description}}</p>
    <p class="card-text">
      <span class="fw-bold">{{price}}</span>
      <span class="text-muted text-decoration-line-through ml-4" *ngIf="originalPrice">{{originalPrice}}</span>

    </p>
  </div>
  <div class="hover-overlay d-flex flex-column justify-content-center align-items-center">
    <button class="py-1 mb-2 add-to-cart-btn" (click)="addToCart(product)">Add to cart</button>


    <div class="mb-4 pb-4">
      <button class="btn  btn-sm text-white">
        <i class="bi bi-share"></i> Share
      </button>
      <button class="btn  btn-sm text-white">
        <i class="bi bi-arrow-left-right"></i> Compare
      </button>
      <button class="btn  btn-sm text-white">
        <i class="bi bi-heart"></i> Like
      </button>
    </div>
  </div>
</div>

<div class="modal fade" id="addToCartModal" tabindex="-1" aria-labelledby="addToCartModalLabel" aria-hidden="true">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="addToCartModalLabel">Shopping Cart</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <div class="cart-item">
          <div class="d-flex justify-content-between">
            <div>
              <img src="/assets/products/sofa.png" alt="Asgard sofa" class="img-fluid" style="width: 50px;">
              <span>Asgard sofa</span>
            </div>
            <div>
              <span>1 x Rs. 250,000.00</span>
            </div>
          </div>
        </div>
        <div class="cart-item">
          <div class="d-flex justify-content-between">
            <div>
              <img src="/assets/products/cafe-chair" alt="Casaliving Wood" class="img-fluid" style="width: 50px;">
              <span>Casaliving Wood</span>
            </div>
            <div>
              <span>1 x Rs. 270,000.00</span>
            </div>
          </div>
        </div>
        <div class="d-flex justify-content-between mt-3">
          <span>Subtotal</span>
          <span>Rs. 520,000.00</span>
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cart</button>
        <button type="button" class="btn btn-primary">Checkout</button>
        <button type="button" class="btn btn-info">Comparison</button>
      </div>
    </div>
  </div>
</div>
