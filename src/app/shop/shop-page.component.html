<div class="container">
    <app-shop-banner></app-shop-banner>

    <div class="row">
        <div class="col-md-3" *ngFor="let product of paginatedProducts">
          <app-product-card [name]="product.name" [product]="product" [description]="product.description" [price]="product.price"
            [originalPrice]="product.originalPrice" [discount]="product.discount" [isNew]="product.isNew"
            [image]="product.image">
          </app-product-card>
        </div>
      </div>

      <nav aria-label="Page navigation example">
        <ul class="pagination justify-content-center">
          <!-- <li class="page-item" [class.disabled]="currentPage === 1">
            <a class="page-link" (click)="changePage(currentPage - 1)">Previous</a>
          </li> -->
          <li class="page-item " *ngFor="let page of pages" [class.active]="page === currentPage">
            <a class="page-link" (click)="changePage(page)">{{page}}</a>
          </li>
          <li class="page-item" style="cursor: pointer;" [class.disabled]="currentPage === totalPages">
            <a class="page-link" (click)="changePage(currentPage + 1)">Next</a>
          </li>
        </ul>
      </nav>

      <app-service-highlights></app-service-highlights>
</div>
